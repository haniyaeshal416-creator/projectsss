<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<meta name="theme-color" content="#10171a"/>
<title>Kinesis Robotics Lab</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M16 2 29 9v14l-13 7L3 23V9z' fill='%2310171a' stroke='%23d4f45c' stroke-width='2'/%3E%3Cpath d='m16 10 6 6-6 6-6-6z' fill='%23d4f45c'/%3E%3C/svg%3E"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"/>
<style>*,::before,::after{box-sizing:border-box;border:0 solid #e5e7eb}
h1,h2,h3,h4,p,figure{margin:0}h1,h2,h3,h4{font-size:inherit;font-weight:inherit}
button,input,select{font:inherit;color:inherit;margin:0;padding:0;background:transparent;border-radius:0}
button{background:none;cursor:pointer;-webkit-appearance:button;text-align:inherit}
ul,ol{list-style:none;margin:0;padding:0}a{color:inherit;text-decoration:inherit}
canvas,svg{display:block}code,kbd{font-family:inherit}


:root {
  font-family: 'Space Grotesk', sans-serif;
  color: #dce5e3;
  background: #0c1215;
  font-synthesis: none;
  text-rendering: optimizeLegibility;
  --bg: #0c1215;
  --panel: #11191d;
  --panel-raised: #162025;
  --line: #263237;
  --line-soft: #1d282c;
  --text: #dce5e3;
  --muted: #829296;
  --dim: #58696e;
  --accent: #d4f45c;
  --accent-dark: #1c250c;
  --danger: #ff6b5e;
  --mono: 'IBM Plex Mono', monospace;
}

* { box-sizing: border-box; }
html, body, #root { margin: 0; min-width: 320px; min-height: 100%; }
body { margin: 0; min-height: 100dvh; overflow-x: hidden; }
button, input, select { font: inherit; }
button { color: inherit; }
button, select, input[type='range'] { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:disabled { opacity: .35; cursor: not-allowed; }
::selection { background: var(--accent); color: #11170b; }
::-webkit-scrollbar { width: 5px; height: 5px; }
::-webkit-scrollbar-thumb { background: #344348; border-radius: 10px; }
::-webkit-scrollbar-track { background: transparent; }
#root { min-height: 100dvh; }

.app-shell {
  min-height: 100dvh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
}

.topbar {
  height: 64px;
  flex: 0 0 64px;
  display: flex;
  align-items: center;
  gap: 32px;
  padding: 0 18px;
  background: #10171a;
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 20;
}
.brand { display: flex; align-items: center; gap: 11px; min-width: 230px; }
.brand-mark { width: 34px; height: 34px; display: grid; place-items: center; position: relative; color: var(--accent); }
.brand-mark svg { position: absolute; }
.brand-mark span { width: 7px; height: 7px; background: var(--accent); transform: rotate(45deg); }
.brand > div:last-child { display: flex; flex-direction: column; line-height: 1; gap: 5px; }
.brand strong { font-size: 15px; letter-spacing: .17em; font-weight: 700; }
.brand > div > span { font-family: var(--mono); color: var(--muted); font-size: 8px; letter-spacing: .2em; }
.project-title { display: flex; align-items: center; gap: 10px; padding-left: 25px; border-left: 1px solid var(--line); }
.project-title span { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: .14em; }
.project-title strong { font-family: var(--mono); font-size: 10px; font-weight: 500; letter-spacing: .08em; }
.topbar-actions { margin-left: auto; display: flex; align-items: center; gap: 9px; }
.system-state { display: flex; align-items: center; gap: 8px; font-family: var(--mono); font-size: 9px; letter-spacing: .08em; color: #a9b9b8; margin-right: 8px; }
.system-state i { width: 6px; height: 6px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px #d4f45c66; }
.system-state.warning { color: var(--danger); }
.system-state.warning i { background: var(--danger); box-shadow: 0 0 10px #ff6b5e66; }
.icon-button, .reset-button, .estop-button { height: 34px; border: 1px solid var(--line); background: #151e22; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 4px; transition: background 160ms, border-color 160ms, transform 160ms; }
.icon-button { width: 34px; }
.icon-button:hover, .reset-button:hover { background: #202c31; border-color: #435358; }
.reset-button { padding: 0 12px; font-size: 11px; }
.estop-button { padding: 0 14px; color: #ff8d82; border-color: #64352f; background: #291917; font-family: var(--mono); font-size: 10px; letter-spacing: .08em; }
.estop-button:hover { background: #40201c; border-color: var(--danger); }
button:active { transform: translateY(1px); }

.workspace {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: 272px minmax(360px, 1fr) 292px;
  grid-template-rows: minmax(420px, 1fr) 178px;
  gap: 1px;
  background: var(--line);
}
.side-panel { background: var(--panel); min-height: 0; overflow-y: auto; overflow-x: hidden; }
.panel-section { padding: 14px 16px; border-bottom: 1px solid var(--line); }
.section-heading { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.section-heading > div { display: flex; align-items: center; gap: 8px; }
.section-heading svg { color: #9dadae; }
.section-heading h2, .timeline-title h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .075em; margin: 0; font-weight: 600; }
.section-heading > span { font-family: var(--mono); font-size: 9px; color: var(--dim); letter-spacing: .1em; }

.joint-list { display: flex; flex-direction: column; gap: 10px; }
.joint-control { display: grid; grid-template-columns: 27px 1fr auto; align-items: center; column-gap: 8px; }
.joint-index { font-family: var(--mono); font-size: 10px; color: var(--accent); }
.joint-name { font-size: 11px; color: #c7d1d0; display: flex; align-items: baseline; gap: 7px; }
.joint-name small { font-family: var(--mono); font-size: 8px; color: var(--dim); text-transform: uppercase; }
.joint-control output { font-family: var(--mono); font-size: 10px; color: #b7c5c5; min-width: 47px; text-align: right; }
input[type='range'] { --range-progress: 50%; appearance: none; height: 3px; border: 0; border-radius: 3px; background: linear-gradient(to right, var(--accent) 0 var(--range-progress), #334045 var(--range-progress) 100%); }
input[type='range']::-webkit-slider-thumb { appearance: none; width: 11px; height: 11px; border-radius: 2px; background: #dce5e3; border: 2px solid #192226; box-shadow: 0 0 0 1px #647477; }
input[type='range']::-moz-range-thumb { width: 9px; height: 9px; border-radius: 2px; background: #dce5e3; border: 2px solid #192226; }
.joint-control input { grid-column: 2 / 4; width: 100%; margin: 7px 0 0; }
.gripper-control { border-top: 1px solid var(--line-soft); margin-top: 12px; padding-top: 12px; }
.gripper-heading { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.gripper-heading > span { display: flex; gap: 7px; align-items: center; font-size: 11px; }
.gripper-heading output { font-family: var(--mono); color: var(--accent); font-size: 11px; }
.gripper-control > input { width: 100%; margin-bottom: 10px; }
.primary-button, .secondary-button { min-height: 36px; border-radius: 4px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 11px; font-weight: 600; transition: background 160ms, border-color 160ms, color 160ms; }
.primary-button { background: var(--accent); border: 1px solid var(--accent); color: #19200d; }
.primary-button:hover { background: #e2ff83; border-color: #e2ff83; }
.secondary-button { background: #182226; border: 1px solid #344247; color: #c7d2d0; }
.secondary-button:hover { background: #223036; border-color: #58696d; }
.full-width { width: 100%; }
.secondary-button kbd { margin-left: auto; font-family: var(--mono); font-size: 9px; border: 1px solid #3a474b; padding: 1px 5px; border-radius: 3px; color: var(--muted); }
.gripper-control .secondary-button { padding: 0 10px; }

.objects-section .section-heading { margin-bottom: 12px; }
.object-list { display: flex; flex-direction: column; gap: 4px; }
.object-row { width: 100%; min-height: 44px; padding: 6px 8px; border: 1px solid transparent; background: transparent; display: flex; align-items: center; gap: 10px; text-align: left; border-radius: 4px; transition: background 150ms, border-color 150ms; }
.object-row:hover { background: #172125; }
.object-row.selected { background: #1b251e; border-color: #3c4a2b; }
.object-row > i { width: 7px; height: 7px; border-radius: 2px; flex: 0 0 auto; }
.object-row > span { display: flex; flex-direction: column; gap: 3px; }
.object-row strong { font-size: 11px; font-weight: 500; }
.object-row small { font-family: var(--mono); font-size: 8px; color: var(--muted); letter-spacing: .08em; }
.object-row svg { margin-left: auto; color: var(--dim); }
.object-row.selected svg { color: var(--accent); }
.object-position { margin: 8px 0; padding: 8px; background: #0e1619; border: 1px solid var(--line-soft); border-radius: 4px; display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.object-position > span { font-family: var(--mono); font-size: 8px; color: var(--dim); letter-spacing: .12em; }
.object-position code { font-family: var(--mono); font-size: 9px; color: #9daeb0; }
.nudge-grid { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.nudge-grid button { height: 26px; background: #182226; border: 1px solid #2d3a3f; border-radius: 3px; font-family: var(--mono); font-size: 9px; }
.nudge-grid button:hover { border-color: var(--accent); color: var(--accent); }

.viewport-panel { position: relative; min-width: 0; min-height: 0; overflow: hidden; background: #11181b; }
.scene-mount { position: absolute; inset: 0; }
.scene-mount canvas { display: block; width: 100%; height: 100%; position: relative; z-index: 2; }
.scene-poster { position: absolute; inset: 0; z-index: 1; display: grid; place-items: center; background: radial-gradient(circle at 50% 45%, #233136, #11181b 65%); }
.scene-poster p { margin-top: 180px; font-family: var(--mono); font-size: 9px; letter-spacing: .18em; color: var(--muted); }
.poster-arm { position: absolute; width: 140px; height: 180px; border-left: 18px solid #637276; transform: rotate(25deg); left: 45%; top: 25%; opacity: .45; }
.poster-arm span { position: absolute; width: 34px; height: 34px; border: 7px solid var(--accent); border-radius: 50%; left: -26px; }
.poster-arm span:nth-child(2) { top: 75px; }.poster-arm span:nth-child(3) { top: 150px; }
.viewport-toolbar { position: absolute; z-index: 5; top: 15px; left: 15px; right: 15px; display: flex; justify-content: space-between; pointer-events: none; }
.toolbar-group { display: flex; padding: 3px; background: #10181bdc; border: 1px solid #334146; border-radius: 5px; backdrop-filter: blur(12px); pointer-events: auto; }
.toolbar-group button { height: 30px; padding: 0 10px; border: 0; border-radius: 3px; background: transparent; color: #8d9da0; display: flex; align-items: center; gap: 6px; font-size: 10px; }
.toolbar-group button:hover { color: var(--text); background: #233035; }
.toolbar-group button.active { color: var(--accent); background: #27311d; }
.toolbar-group.compact button { width: 32px; padding: 0; justify-content: center; }
.viewport-label { position: absolute; z-index: 4; top: 67px; left: 18px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
.viewport-label span { font-size: 22px; font-weight: 500; letter-spacing: -.03em; color: #e0e8e5; }
.viewport-label small { font-family: var(--mono); font-size: 8px; letter-spacing: .1em; color: #75878b; }
.selection-chip { position: absolute; z-index: 5; left: 16px; bottom: 66px; display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 10px; background: #111a1edb; border: 1px solid #344247; border-radius: 4px; backdrop-filter: blur(10px); font-family: var(--mono); font-size: 9px; }
.selection-chip svg, .selection-chip strong { color: var(--accent); }.selection-chip strong { font-size: 8px; letter-spacing: .08em; }
.telemetry-strip { position: absolute; z-index: 5; left: 0; right: 0; bottom: 0; min-height: 48px; display: flex; align-items: center; justify-content: flex-end; gap: 22px; padding: 8px 17px; background: linear-gradient(90deg, #0e161900, #0e1619cc 25%, #0e1619ee); border-top: 1px solid #27333788; pointer-events: none; }
.telemetry-strip > div { display: flex; flex-direction: column; gap: 3px; }
.telemetry-strip span { font-family: var(--mono); font-size: 7px; letter-spacing: .12em; color: #6e8185; }
.telemetry-strip strong { font-family: var(--mono); font-size: 10px; font-weight: 400; color: #c4d0ce; }
.telemetry-strip small { color: #617478; font-size: 8px; }
.collision-banner { position: absolute; z-index: 7; top: 66px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 9px 12px; background: #321b19ed; border: 1px solid #86453d; color: #ff9489; border-radius: 4px; font-size: 10px; white-space: nowrap; }
.collision-banner strong { font-family: var(--mono); font-size: 9px; font-weight: 400; color: #d7a19b; }
.emergency-overlay { position: absolute; z-index: 10; inset: 0; background: #160d0cd9; backdrop-filter: blur(5px); display: flex; flex-direction: column; align-items: center; justify-content: center; color: var(--danger); gap: 10px; }
.emergency-overlay strong { font-family: var(--mono); letter-spacing: .14em; font-size: 17px; }.emergency-overlay span { color: #c99892; font-size: 12px; }
.emergency-overlay button { margin-top: 12px; background: #3a201c; border: 1px solid #914a40; padding: 10px 16px; border-radius: 4px; }

.bare-icon { width: 26px; height: 26px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: 3px; }
.bare-icon:hover { background: #233035; color: var(--text); }
.preset-select { display: block; }
.preset-select > span { display: block; font-family: var(--mono); font-size: 8px; letter-spacing: .12em; color: var(--dim); margin-bottom: 7px; }
.preset-select > div { position: relative; }
.preset-select select { width: 100%; height: 36px; appearance: none; background: #182226; border: 1px solid #334147; color: #d2dcda; border-radius: 4px; padding: 0 34px 0 11px; font-size: 11px; }
.preset-select svg { position: absolute; right: 10px; top: 11px; pointer-events: none; color: var(--muted); }
.sequence-summary { display: flex; justify-content: space-between; margin: 14px 0 8px; font-family: var(--mono); font-size: 8px; letter-spacing: .08em; color: var(--dim); }
.sequence-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 12px; }
.sequence-row { display: grid; grid-template-columns: 24px 1fr auto 14px; align-items: center; gap: 7px; min-height: 43px; padding: 5px 6px; border: 1px solid transparent; background: transparent; border-radius: 4px; text-align: left; }
.sequence-row:hover { background: #172125; }.sequence-row.selected { background: #1c251d; border-color: #3b492c; }
.sequence-number { font-family: var(--mono); font-size: 9px; color: #65767a; }
.sequence-row > span:nth-child(2) { display: flex; flex-direction: column; gap: 2px; }
.sequence-row strong { font-size: 10px; font-weight: 500; }.sequence-row small { font-size: 8px; color: var(--muted); }
.sequence-row code { font-family: var(--mono); font-size: 9px; color: #8fa0a2; }.sequence-row svg { color: #5e7074; }
.sequence-row.selected .sequence-number, .sequence-row.selected svg { color: var(--accent); }
.status-good { color: var(--accent) !important; }.status-bad { color: var(--danger) !important; }
.toggle-row { display: flex; align-items: center; position: relative; padding: 9px 0; cursor: pointer; }
.toggle-row > span { display: flex; flex-direction: column; gap: 3px; }
.toggle-row strong { font-size: 10px; font-weight: 500; }.toggle-row small { font-size: 9px; color: var(--muted); }
.toggle-row input { position: absolute; opacity: 0; right: 0; }
.toggle-row > i { margin-left: auto; width: 30px; height: 17px; background: #334045; border-radius: 12px; position: relative; transition: background 160ms; }
.toggle-row > i:after { content: ''; position: absolute; width: 11px; height: 11px; top: 3px; left: 3px; background: #9aabac; border-radius: 50%; transition: transform 160ms, background 160ms; }
.toggle-row input:checked + i { background: #536528; }.toggle-row input:checked + i:after { transform: translateX(13px); background: var(--accent); }
.toggle-row input:focus-visible + i { outline: 2px solid var(--accent); outline-offset: 3px; }
.event-log { border-top: 1px solid var(--line-soft); margin-top: 10px; padding-top: 12px; }
.event-log > div { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 8px; letter-spacing: .1em; color: var(--dim); margin-bottom: 9px; }
.event-log p { display: flex; align-items: center; gap: 7px; margin: 6px 0; font-family: var(--mono); font-size: 8px; color: #859699; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.event-log p i { flex: 0 0 auto; width: 3px; height: 3px; border-radius: 50%; background: #607276; }

.timeline-panel { grid-column: 1 / -1; background: #10181b; min-width: 0; overflow: hidden; }
.timeline-topline { height: 57px; display: flex; align-items: center; padding: 0 16px; gap: 20px; border-bottom: 1px solid var(--line); }
.timeline-title { display: flex; align-items: center; gap: 8px; min-width: 250px; }
.timeline-title svg { color: #9aabad; }.timeline-title > span { font-family: var(--mono); font-size: 7px; color: var(--dim); letter-spacing: .1em; margin-left: 5px; }
.transport-controls { display: flex; align-items: center; gap: 4px; }
.transport-controls button, .timeline-settings button { height: 30px; min-width: 30px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid #334045; background: #172125; border-radius: 3px; color: #9cabad; }
.transport-controls button:hover, .timeline-settings button:hover { background: #243237; color: var(--text); }
.transport-controls button.active { color: var(--accent); border-color: #52632f; }
.transport-controls .play-button { background: var(--accent); color: #1a210f; border-color: var(--accent); padding: 0 13px; font-size: 10px; font-weight: 600; }
.transport-controls .play-button:hover { background: #e2ff83; }
.timeline-settings { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.timeline-settings label { display: flex; align-items: center; gap: 7px; font-family: var(--mono); font-size: 7px; letter-spacing: .08em; color: var(--dim); }
.timeline-settings select { height: 30px; background: #172125; color: #b7c5c4; border: 1px solid #334045; border-radius: 3px; font-family: var(--mono); font-size: 9px; padding: 0 6px; }
.timeline-settings button { padding: 0 9px; font-size: 9px; }
.timeline-settings > code { font-family: var(--mono); font-size: 12px; color: var(--accent); min-width: 70px; text-align: right; margin-left: 6px; }
.timeline-body { height: 120px; display: grid; grid-template-columns: 104px 1fr; padding: 12px 18px 0 16px; gap: 12px; }
.track-labels { display: grid; grid-template-rows: 63px 20px; padding-top: 20px; font-family: var(--mono); font-size: 7px; letter-spacing: .08em; color: #687b7f; }
.timeline-track-wrap { position: relative; min-width: 0; }
.timeline-ruler { height: 20px; position: relative; border-bottom: 1px solid #2b383c; }
.timeline-ruler span { position: absolute; top: 0; font-family: var(--mono); font-size: 8px; color: #66797d; transform: translateX(-50%); }
.timeline-ruler span:after { content: ''; position: absolute; top: 15px; left: 50%; height: 5px; width: 1px; background: #435156; }
.timeline-track { height: 43px; position: relative; background: #141e22; border: 1px solid #2b393e; cursor: crosshair; }
.track-segments { position: absolute; inset: 0; }
.track-segments i { position: absolute; top: 0; bottom: 0; width: 1px; background: #2d3b3f; }
.keyframe-marker { position: absolute; top: 13px; width: 13px; height: 13px; padding: 0; transform: translateX(-50%) rotate(45deg); background: #7f9193; border: 2px solid #141e22; box-shadow: 0 0 0 1px #637679; z-index: 4; }
.keyframe-marker:hover, .keyframe-marker.selected { background: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.keyframe-marker span { position: absolute; transform: rotate(-45deg); transform-origin: 0 0; left: 11px; top: 13px; width: 70px; text-align: left; font-family: var(--mono); font-size: 7px; color: #76898c; pointer-events: none; }
.keyframe-marker.selected span { color: var(--accent); }
.playhead { position: absolute; z-index: 3; top: -21px; bottom: -22px; width: 1px; background: var(--accent); pointer-events: none; }
.playhead:before { content: ''; position: absolute; top: 0; left: -4px; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 6px solid var(--accent); }
.playhead i { position: absolute; bottom: 0; left: -2px; width: 5px; height: 5px; background: var(--accent); border-radius: 50%; }
.gripper-track { height: 20px; margin-top: 8px; position: relative; background: #131d20; border: 1px solid #273539; }
.gripper-track i { position: absolute; top: 6px; width: 5px; height: 5px; border: 1px solid #6f8386; border-radius: 50%; transform: translateX(-50%); }
.gripper-track i.closed { background: var(--accent); border-color: var(--accent); }

.modal-backdrop { position: fixed; z-index: 50; inset: 0; background: #070c0ed9; backdrop-filter: blur(8px); display: grid; place-items: center; padding: 20px; }
.help-modal { width: min(480px, 100%); max-height: calc(100dvh - 40px); overflow-y: auto; position: relative; padding: 30px; background: #131d21; border: 1px solid #3a494e; border-radius: 8px; box-shadow: 0 24px 80px #0008; }
.modal-close { position: absolute; right: 14px; top: 14px; width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); background: #192428; border-radius: 4px; }
.modal-kicker { font-family: var(--mono); font-size: 8px; letter-spacing: .13em; color: var(--accent); }
.help-modal h2 { font-size: 26px; letter-spacing: -.04em; margin: 12px 0; }.help-modal > p { color: #9aabac; font-size: 13px; line-height: 1.65; }
.help-steps { margin: 22px 0; display: flex; flex-direction: column; gap: 14px; }
.help-steps > div { display: flex; gap: 12px; }.help-steps > div > span { font-family: var(--mono); color: var(--accent); font-size: 10px; padding-top: 3px; }
.help-steps p { margin: 0; font-size: 12px; color: #91a2a4; line-height: 1.5; }.help-steps strong { display: block; color: #d9e2e0; font-size: 13px; margin-bottom: 3px; }
.shortcut-list { display: flex; flex-wrap: wrap; gap: 12px; border-top: 1px solid var(--line); padding: 18px 0; margin-bottom: 4px; }
.shortcut-list span { font-size: 10px; color: #93a4a6; }.shortcut-list kbd { font-family: var(--mono); color: var(--accent); background: #202b23; border: 1px solid #46532f; border-radius: 3px; padding: 2px 5px; margin-right: 4px; }
.is-emergency .topbar { border-bottom-color: #7b3831; }

@media (max-width: 1180px) {
  .workspace { grid-template-columns: 240px minmax(330px, 1fr) 256px; }
  .project-title { display: none; }
  .timeline-title { min-width: 190px; }.timeline-title > span { display: none; }
  .timeline-topline { gap: 10px; }.timeline-settings label { display: none; }
  .panel-section { padding-left: 13px; padding-right: 13px; }
  .joint-name small { display: none; }
}

@media (max-width: 900px) {
  .app-shell { height: auto; overflow: visible; }
  .topbar { gap: 10px; padding: 0 12px; }.brand { min-width: 0; }.brand > div > span { display: none; }
  .system-state, .reset-button { display: none; }
  .workspace { display: flex; flex-direction: column; }
  .viewport-panel { order: 1; height: 520px; min-height: 520px; }
  .left-panel { order: 2; overflow: visible; display: grid; grid-template-columns: 1fr 1fr; }
  .right-panel { order: 3; overflow: visible; display: grid; grid-template-columns: 1fr 1fr; }
  .timeline-panel { order: 4; min-height: 178px; }
  .panel-section { border-right: 1px solid var(--line); }
  .timeline-title { min-width: 0; }.timeline-title h2 { display: none; }
  .timeline-settings > code { min-width: 58px; }
}

@media (max-width: 600px) {
  .topbar { height: 56px; flex-basis: 56px; }.brand strong { font-size: 12px; }.brand-mark { width: 28px; }
  .topbar-actions { gap: 5px; }.estop-button { padding: 0 10px; }
  .viewport-panel { height: 460px; min-height: 460px; }
  .left-panel, .right-panel { display: block; }
  .viewport-toolbar { top: 10px; left: 10px; right: 10px; }.toolbar-group button span { display: none; }
  .viewport-label { top: 57px; left: 12px; }.viewport-label span { font-size: 18px; }
  .telemetry-strip { gap: 14px; padding-left: 12px; padding-right: 12px; }.telemetry-strip > div:nth-child(3) { display: none; }
  .selection-chip { bottom: 60px; left: 10px; }
  .collision-banner { max-width: calc(100% - 20px); white-space: normal; top: 58px; }
  .timeline-topline { height: auto; min-height: 94px; flex-wrap: wrap; padding: 10px; }
  .timeline-title { display: none; }.transport-controls { order: 1; }.timeline-settings { order: 2; width: 100%; margin-left: 0; justify-content: flex-end; }
  .timeline-body { grid-template-columns: 1fr; padding-left: 12px; padding-right: 12px; }.track-labels { display: none; }
  .keyframe-marker span { display: none; }
  .help-modal { padding: 24px 20px; }
}

@media (prefers-reduced-motion: reduce) {
  *, *:before, *:after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
}
